name: Build patched odm_orthophoto.exe (VicTerra P0 fix)

on:
  push:
    branches: [ p1-patch, p1-patch-fast ]
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: 'Prior run ID to restore vcpkg_installed/ from (skips the ~1hr vcpkg install). Leave empty for a clean build.'
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional fast path: restore a previously-built vcpkg_installed/ from an earlier run's
      # artifact instead of rebuilding GDAL/Eigen3/OpenCV from source again (~1hr). Only runs
      # when explicitly asked for via workflow_dispatch's restore_run_id input -- a plain push
      # always does a clean vcpkg install, since we can't know in advance whether a prior run's
      # artifact is even compatible with what changed.
      - name: Restore vcpkg_installed/ from a prior run (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.restore_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: vcpkg-installed-x64-static
          path: vcpkg_installed
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}

      # windows-latest ships CMake 4.x, which dropped policy compatibility below 3.5
      # entirely -- CMAKE_POLICY_VERSION_MINIMUM=3.5 alone can't restore a policy version
      # the binary itself no longer knows about (confirmed: run 3 still failed inside
      # vcpkg.cmake and GDAL/Eigen3/OpenCV's own *Targets.cmake with the same "Invalid
      # CMAKE_POLICY_VERSION_MINIMUM" error). Pin an actual 3.31.x CMake instead and put
      # it ahead of the runner's default on PATH.
      - name: Pin CMake 3.31.6 (windows-latest's default is CMake 4.x, incompatible with this old CMakeLists.txt)
        shell: pwsh
        run: |
          pip install cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { throw "pip install cmake==3.31.6 failed" }
          # Find the actual cmake.exe pip just installed rather than trusting any one
          # internal API of the cmake package (it's changed across versions before).
          $sitePkgs = python -c "import site; print(site.getsitepackages()[0])"
          Write-Host "site-packages: $sitePkgs"
          $cmakeExe = Get-ChildItem -Path $sitePkgs -Recurse -Filter "cmake.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "cmake\\data\\bin" -or $_.FullName -match "cmake\\bin" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $cmakeExe) {
            # Fall back to a full scan if the expected subpath shape changed.
            $cmakeExe = Get-ChildItem -Path $sitePkgs -Recurse -Filter "cmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cmakeExe) { throw "pip installed cmake==3.31.6 but no cmake.exe found under $sitePkgs" }
          $cmakeDir = Split-Path -Parent $cmakeExe
          Write-Host "Pinned CMake bin dir: $cmakeDir ($cmakeExe)"
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeDir

      - name: Verify pinned CMake version resolved (not the runner's default 4.x)
        shell: pwsh
        run: |
          $v = (cmake --version | Out-String)
          Write-Host $v
          if ($v -notmatch "3\.31\.6") { throw "cmake --version did not resolve to 3.31.6 -- PATH pin did not take effect: $v" }

      - name: Export GitHub Actions cache vars for vcpkg (x-gha binary cache)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: vcpkg install (manifest mode, local install root, GHA binary cache)
        if: hashFiles('vcpkg_installed/x64-windows-static/lib/gdal*.lib') == ''
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "VCPKG_INSTALLATION_ROOT=$vcpkgRoot"
          & "$vcpkgRoot\vcpkg.exe" install --triplet x64-windows-static --x-install-root=vcpkg_installed --x-manifest-root=. --feature-flags=manifests
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }

      - name: Confirm vcpkg_installed/ is usable (restored or freshly built)
        shell: pwsh
        run: |
          $gdalLib = Get-ChildItem -Path "vcpkg_installed\x64-windows-static\lib" -Filter "gdal*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gdalLib) { throw "vcpkg_installed/x64-windows-static/lib has no gdal*.lib -- restore or install did not produce a usable tree" }
          Write-Host "vcpkg_installed looks usable: $($gdalLib.FullName)"

      # Archive the freshly-built (or restored, harmless no-op re-upload) vcpkg_installed/ so a
      # LATER run can restore it via workflow_dispatch's restore_run_id instead of rebuilding
      # GDAL/Eigen3/OpenCV from source again. This is the expensive part (~1hr); everything
      # after it (Configure/Build) is minutes, so this is the artifact worth saving.
      - name: Archive vcpkg_installed/ for fast restore on a later run
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-installed-x64-static
          path: vcpkg_installed/
          retention-days: 14
          if-no-files-found: error

      - name: Resolve GDAL include/lib paths
        id: gdal
        shell: pwsh
        run: |
          $installRoot = "vcpkg_installed\x64-windows-static"
          $incDir = Resolve-Path "$installRoot\include" | Select-Object -ExpandProperty Path
          $gdalLib = Get-ChildItem -Path "$installRoot\lib" -Filter "gdal*.lib" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $gdalLib) { throw "Could not find a gdal*.lib under $installRoot\lib" }
          Write-Host "GDAL include dir: $incDir"
          Write-Host "GDAL lib: $gdalLib"
          "inc=$incDir" >> $env:GITHUB_OUTPUT
          "lib=$gdalLib" >> $env:GITHUB_OUTPUT

      # Version-agnostic MSVC activation -- do NOT hardcode a "Visual Studio NN YYYY" CMake
      # generator name (it broke once already: windows-latest moved past "Visual Studio 17
      # 2022" and CMake could not find any VS instance under that name). ilammy/msvc-dev-cmd
      # finds whatever MSVC is actually installed and exports cl.exe/link.exe etc into PATH,
      # so we can drive the build with the Ninja generator instead, which has no version
      # string to go stale.
      - name: Activate MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Two prior attempts to force /MT via CMake variables (CMAKE_MSVC_RUNTIME_LIBRARY +
      # CMAKE_POLICY_DEFAULT_CMP0091=NEW, then also CMAKE_CXX_FLAGS_RELEASE) both failed
      # identically -- Logger.cpp.obj still links as MD_DynamicRelease. Root cause: this
      # file's FIRST line is `project(odm_orthophoto)`, with `cmake_minimum_required(VERSION
      # 2.8)` only on line 2 -- AFTER project(), not before it (the normal, expected order).
      # Policy settings and CMAKE_POLICY_DEFAULT_CMP0091 only affect the compiler/runtime
      # detection that project() performs if they're in effect BEFORE that project() call;
      # with nothing preceding it in the file, command-line policy defaults weren't reaching
      # it. Patch the text directly instead of fighting this from the command line.
      - name: Patch CMakeLists.txt to force /MT (project() has no preceding cmake_minimum_required to hook)
        shell: pwsh
        run: |
          $path = "CMakeLists.txt"
          $original = Get-Content -Path $path -Raw
          Write-Host "--- original CMakeLists.txt (first 5 lines) ---"
          ($original -split "`n")[0..4] | ForEach-Object { Write-Host $_ }

          $preludeLines = @(
            'cmake_minimum_required(VERSION 3.15)',
            'cmake_policy(SET CMP0091 NEW)',
            'set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>")',
            ''
          )
          $prelude = ($preludeLines -join "`n") + "`n"
          $patched = $prelude + $original

          # Right after the (now second) project() line, force-replace any /MD the compiler
          # defaults or vcpkg toolchain might still inject in these four flag variables.
          $postProjectLines = @(
            'project(odm_orthophoto)',
            'foreach(f CMAKE_C_FLAGS CMAKE_CXX_FLAGS CMAKE_C_FLAGS_RELEASE CMAKE_CXX_FLAGS_RELEASE)',
            '  string(REPLACE "/MD" "/MT" ${f} "${${f}}")',
            'endforeach()'
          )
          $postProjectPatch = $postProjectLines -join "`n"
          $patched = $patched.Replace('project(odm_orthophoto)', $postProjectPatch)

          # The ORIGINAL cmake_minimum_required(VERSION 2.8) call is still further down in the
          # file (that's the whole reason we're here). Left as-is, that second, lower call
          # would re-evaluate compatibility policies for a version below 3.15 and could reset
          # CMP0091 back to OLD, undoing everything above. Neutralize it.
          if ($patched -notmatch [regex]::Escape('cmake_minimum_required(VERSION 2.8)')) {
            throw "Expected to find the original 'cmake_minimum_required(VERSION 2.8)' line to neutralize it, but didn't -- upstream file shape changed, needs a look"
          }
          $patched = $patched -replace [regex]::Escape('cmake_minimum_required(VERSION 2.8)'), '# (neutralized by build.yml patch step -- see cmake_minimum_required(VERSION 3.15) above)'

          Set-Content -Path $path -Value $patched -NoNewline
          Write-Host "--- patched CMakeLists.txt (first 12 lines) ---"
          (Get-Content -Path $path)[0..11] | ForEach-Object { Write-Host $_ }

      - name: Configure (CMake + Ninja + vcpkg toolchain)
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          # vcpkg's eigen3 port only exposes a modern imported target (Eigen3::Eigen) via
          # Eigen3Config.cmake -- it does NOT set the legacy EIGEN3_INCLUDE_DIR variable this
          # old CMakeLists.txt (`include_directories(${EIGEN3_INCLUDE_DIR})`) expects, so that
          # expands to empty and every '#include <Eigen/Dense>' fails. Same class of gap as
          # GDAL_INCLUDE_DIR/GDAL_LIBRARY above -- bridge it explicitly. Eigen headers live one
          # level down, in include/eigen3, not include/ directly.
          $eigenInc = "$PWD\vcpkg_installed\x64-windows-static\include\eigen3"
          if (-not (Test-Path "$eigenInc\Eigen\Dense")) { throw "Expected Eigen headers at $eigenInc\Eigen but Dense wasn't found there" }
          Write-Host "Eigen include dir: $eigenInc"

          cmake -B build -S . -G Ninja `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_C_FLAGS_RELEASE="/MT /O2 /Ob2 /DNDEBUG" `
            -DCMAKE_CXX_FLAGS_RELEASE="/MT /O2 /Ob2 /DNDEBUG" `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DVCPKG_INSTALLED_DIR="$PWD\vcpkg_installed" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGDAL_INCLUDE_DIR="${{ steps.gdal.outputs.inc }}" `
            -DGDAL_LIBRARY="${{ steps.gdal.outputs.lib }}" `
            -DEIGEN3_INCLUDE_DIR="$eigenInc"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build (Release, verbose -- fail fast if Logger.cpp isn't compiling /MT)
        shell: pwsh
        run: |
          cmake --build build --parallel -- -v 2>&1 | Tee-Object -FilePath build-verbose.log
          $loggerLine = Select-String -Path build-verbose.log -Pattern "Logger\.cpp" | Select-Object -First 1
          if (-not $loggerLine) { throw "Never even found a compile line for Logger.cpp in the verbose Ninja output -- can't confirm /MT took effect" }
          Write-Host "Logger.cpp compile line: $($loggerLine.Line)"
          if ($loggerLine.Line -notmatch "/MT\b") { throw "Logger.cpp compile line does not contain /MT -- the patch did not take effect: $($loggerLine.Line)" }
          if ($loggerLine.Line -match "/MD\b") { throw "Logger.cpp compile line STILL contains /MD alongside /MT -- conflicting flags: $($loggerLine.Line)" }
          Write-Host "Confirmed: Logger.cpp compiling with /MT, no /MD present."
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Locate built exe + compute sha256
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "odm_orthophoto.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "odm_orthophoto.exe not found after build" }
          Write-Host "Found: $exe"
          $hash = Get-FileHash -Path $exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash
          Write-Host "SHA256: $hash"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $exe -Destination "dist\odm_orthophoto.exe"
          $hash | Out-File -FilePath "dist\odm_orthophoto.exe.sha256.txt" -Encoding ascii -NoNewline
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: odm_orthophoto-p1-windows-x64-static
          path: dist/
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: |
          "## Build result" >> $env:GITHUB_STEP_SUMMARY
          "SHA256: ``${{ steps.artifact.outputs.sha256 }}``" >> $env:GITHUB_STEP_SUMMARY
